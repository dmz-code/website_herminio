<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiavic | Regresaa Mexico pero mejor preparado</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="brand">Quiavic</p>
      <h1>Regresaa Mexico pero mejor preparado</h1>
      <p class="intro">Selecciona una opción para enviarnos tu información. Cada botón abre su propio formulario.</p>
    </header>

    <section class="actions" aria-label="Opciones de formulario">
      <button class="action-btn active" data-target="regresar">Quiero regresar</button>
      <button class="action-btn" data-target="oportunidades">Oportunidades en mexico</button>
      <button class="action-btn" data-target="asesoria">Asesoria</button>
      <button class="action-btn" data-target="crecimiento">Crecimeinto personal</button>
    </section>

    <section class="forms">
      <form class="card active" data-form="regresar" data-endpoint="/api/quiero-regresar/">
        <h2>Quiero regresar</h2>
        <input name="nombre" placeholder="Nombre completo" required />
        <input name="email" type="email" placeholder="Correo electrónico" required />
        <input name="telefono" placeholder="Teléfono" required />
        <textarea name="plan" rows="4" placeholder="¿Cuándo quieres regresar y qué necesitas?" required></textarea>
        <button type="submit">Enviar solicitud</button>
        <p class="feedback" aria-live="polite"></p>
      </form>

      <form class="card" data-form="oportunidades" data-endpoint="/api/oportunidades-mexico/">
        <h2>Oportunidades en mexico</h2>
        <input name="nombre" placeholder="Nombre completo" required />
        <input name="email" type="email" placeholder="Correo electrónico" required />
        <input name="sector" placeholder="Sector de interés" required />
        <textarea name="mensaje" rows="4" placeholder="Cuéntanos qué oportunidades estás buscando" required></textarea>
        <button type="submit">Enviar solicitud</button>
        <p class="feedback" aria-live="polite"></p>
      </form>

      <form class="card" data-form="asesoria" data-endpoint="/api/asesoria/">
        <h2>Asesoria</h2>
        <input name="nombre" placeholder="Nombre completo" required />
        <input name="email" type="email" placeholder="Correo electrónico" required />
        <input name="tema" placeholder="Tema de asesoría" required />
        <textarea name="detalle" rows="4" placeholder="Describe tu caso" required></textarea>
        <button type="submit">Enviar solicitud</button>
        <p class="feedback" aria-live="polite"></p>
      </form>

      <form class="card" data-form="crecimiento" data-endpoint="/api/crecimiento-personal/">
        <h2>Crecimeinto personal</h2>
        <input name="nombre" placeholder="Nombre completo" required />
        <input name="email" type="email" placeholder="Correo electrónico" required />
        <input name="objetivo" placeholder="Objetivo principal" required />
        <textarea name="mensaje" rows="4" placeholder="¿En qué área quieres crecer?" required></textarea>
        <button type="submit">Enviar solicitud</button>
        <p class="feedback" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
